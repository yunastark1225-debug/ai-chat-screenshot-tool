<!doctype html>
<meta charset="utf-8">
<title>Full page capture regression fixture</title>
<style>
  html { scroll-behavior: smooth; scroll-snap-type: y proximity; }
  body { margin: 0; font: 18px system-ui; }
  header { position: sticky; top: 0; background: #ffe082; height: 80px; }
  aside { position: fixed; bottom: 0; right: 0; background: magenta; padding: 30px; z-index: 10; }
  section { box-sizing: border-box; height: 400px; border-bottom: 2px solid black; padding: 30px; }
  section:nth-of-type(odd) { background: #b3e5fc; }
  section:nth-of-type(even) { background: #c8e6c9; }
  .sticky { position: sticky; top: 80px; background: #ffa726; }
  #lazy { display: block; width: 200px; }
  footer { height: 137px; background: #e57373; }
</style>
<header>TOP — this sticky header must appear once</header>
<aside>FIXED OVERLAY — omitted in PNG, restored afterwards</aside>
<section>1 — 80 to 480</section>
<section>2 — 480 to 880</section>
<section><div class="sticky">3 — sticky below the first viewport must remain</div></section>
<section>4</section>
<section>5 — delayed image expands the page below</section>
<img id="lazy" alt="Lazy image">
<section>6</section>
<section>7</section>
<footer>BOTTOM — entire red footer, including this final line</footer>
<script>
 const img = document.querySelector('#lazy');
 const observer = new IntersectionObserver(entries => {
  if (!entries.some(e=>e.isIntersecting)) return;
  observer.disconnect();
  setTimeout(() => {
   img.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160"><rect width="200" height="160" fill="navy"/><text x="10" y="90" fill="white">LAZY IMAGE LOADED</text></svg>');
  }, 200);
 });
 observer.observe(img);
</script>
